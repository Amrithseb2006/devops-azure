# k3s ships with the Traefik ingress controller, which listens on the VM's port 80.
# So http://<APP_VM_PUBLIC_IP>/ reaches the Service above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-demo
  namespace: devops-demo
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-demo
                port:
                  number: 80
