---
# One-time preparation of the APP VM: installs a single-node Kubernetes cluster (k3s).
# k3s bundles containerd, kubectl, the Traefik ingress controller (port 80) and a local load balancer.
# Run manually (from the Jenkins VM):
#   ansible-playbook -i inventory.ini setup-server.yml --private-key ~/azure_devops_key
- name: Prepare app VM (install Kubernetes / k3s)
  hosts: app_servers
  become: true

  tasks:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Download the k3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"

    - name: Install k3s (skipped if already installed)
      ansible.builtin.command: /tmp/k3s-install.sh
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_EXEC: "server --write-kubeconfig-mode 644"

    - name: Make sure k3s is enabled and running
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: true

    - name: Wait until the node is Ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false
      retries: 5
      delay: 10
      register: node_ready
      until: node_ready.rc == 0

    - name: Show cluster status
      ansible.builtin.command: k3s kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - ansible.builtin.debug:
        var: nodes.stdout_lines
